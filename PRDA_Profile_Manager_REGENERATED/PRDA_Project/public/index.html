<!doctype html>
<html lang="en">
  <head>
    <!-- Set the page's text encoding and make it fit different screen sizes. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Manager | Login</title>

    <!-- Load the page's regular styles and its Tailwind utility styles. -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/tailwind.css">
  </head>
  <body>
    <!-- Keep the login content together inside the main page panel. -->
    <main class="panel">
      <div class="brand">PROFILE MANAGER</div>
      <h1>Welcome back</h1>
      <p class="muted">Log in to manage your profile.</p>

      <!-- The app.js file handles what happens when this form is submitted. -->
      <form id="login-form">
        <label>
          Username
          <input
            name="username"
            required
            autocomplete="username"
            placeholder="Your username"
          >
        </label>
        <label>
          Password
          <input
            name="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Your password"
          >
        </label>
        <p id="message" class="message" role="alert" hidden></p>
        <button type="submit">Log in</button>
      </form>

      <!-- Offer new visitors a link to create an account. -->
      <p class="foot">
        New here? <a href="/register.html">Create an account</a>
      </p>
    </main>

    <!-- Load the JavaScript that adds behavior to the login form. -->
    <script src="/app.js"></script>
  </body>
</html>
