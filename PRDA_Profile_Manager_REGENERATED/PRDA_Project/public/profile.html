<!doctype html>
<html lang="en">
  <head>
    <!-- Set the page's text encoding and help it fit different screen sizes. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | Profile Manager</title>

    <!-- Load the styles shared by the login, registration, and profile pages. -->
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <!-- Group the signed-in user's profile information and form in one panel. -->
    <main class="panel">
      <div class="top">
        <div class="brand">PROFILE MANAGER</div>
        <button class="secondary" id="logout" type="button">Log out</button>
      </div>
      <h1>My profile</h1>
      <p class="muted">Signed in as <strong id="username">...</strong></p>

      <!-- The JavaScript loads these values and sends saved changes to the server. -->
      <form id="profile-form">
        <label>
          Email address
          <input name="email" type="email" required>
        </label>
        <label>
          Phone number
          <input
            name="phone"
            inputmode="numeric"
            pattern="[0-9]{7,15}"
            required
          >
        </label>
        <label>
          Date of birth
          <input name="dob" type="date" required>
        </label>
        <p id="message" class="message" role="status" hidden></p>
        <button type="submit">Save changes</button>
      </form>
    </main>

    <!-- Add the behavior for loading, saving, and logging out of a profile. -->
    <script src="/app.js"></script>
  </body>
</html>
