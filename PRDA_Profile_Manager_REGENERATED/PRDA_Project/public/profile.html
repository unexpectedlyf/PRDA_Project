<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile | Profile Manager</title><link rel="stylesheet" href="/style.css"></head><body><main class="panel"><div class="top"><div class="brand">PROFILE MANAGER</div><button class="secondary" id="logout" type="button">Log out</button></div><h1>My profile</h1><p class="muted">Signed in as <strong id="username">...</strong></p><form id="profile-form"><label>Email address<input name="email" type="email" required></label><label>Phone number<input name="phone" inputmode="numeric" pattern="[0-9]{7,15}" required></label><label>Date of birth<input name="dob" type="date" required></label><p id="message" class="message" role="status" hidden></p><button type="submit">Save changes</button></form></main><script src="/app.js"></script></body></html>
